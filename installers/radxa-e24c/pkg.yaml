name: radxa-e24c
variant: scratch
shell: /toolchain/bin/bash
dependencies:
  - stage: base
steps:
  - env:
      GOPATH: /tmp/go
      PATH: /toolchain/go/bin:/toolchain/bin:/usr/bin:/bin
      SSL_CERT_FILE: /toolchain/etc/ssl/certs/ca-certificates
      GODEBUG: x509useFallbackRoots=0
    network: default
    cachePaths:
      - /.cache/go-build
      - /tmp/go/pkg
    prepare:
      - |
        cd /pkg/src
        go mod download
  - env:
      GOPATH: /tmp/go
      PATH: /toolchain/go/bin:/toolchain/bin:/usr/bin:/bin
      SSL_CERT_FILE: /toolchain/etc/ssl/certs/ca-certificates
    cachePaths:
      - /.cache/go-build
      - /tmp/go/pkg
    build:
      - |
        cd /pkg/src
        CGO_ENABLED=0 go build -o ./radxa-e24c .
    install:
      - |
        mkdir -p /rootfs/installers/

        cp /pkg/src/radxa-e24c /rootfs/installers/radxa-e24c
finalize:
  - from: /rootfs
    to: /rootfs