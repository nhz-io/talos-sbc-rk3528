# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
#   RK3528 U-Boot support:
#     - https://docs.u-boot.org/en/v2025.07/board/rockchip/rockchip.html
name: u-boot-radxa-e24c
variant: scratch
shell: /toolchain/bin/bash
dependencies:
  - stage: base
  - stage: rkbin-rk3528

steps:
  - sources:
      - url: https://github.com/Kwiboo/u-boot-rockchip/archive/{{ .uboot_ref }}.tar.gz
        destination: u-boot.tar.gz
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
      PATH: /toolchain/bin:/usr/bin:/bin
      SSL_CERT_FILE: /toolchain/etc/ssl/certs/ca-certificates
      LD_LIBRARY_PATH: /toolchain/lib
    network: default
    prepare:
      - |
        tar -xzf u-boot.tar.gz --strip-components=1
        rm u-boot.tar.gz

        mkdir -p /usr/bin /bin \
          && ln -sf /toolchain/bin/env /usr/bin/env \
          && ln -sf /toolchain/bin/python3 /toolchain/bin/python \
          && ln -sf /toolchain/bin/bash /bin/sh \
          && ln -sf /toolchain/bin/bash /bin/bash

        pip3 install pyelftools setuptools
        make radxa-e24c-rk3528_defconfig
    build:
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" BL31=/libs/rkbin/bl31.elf ROCKCHIP_TPL=/libs/rkbin/ddr.bin
    install:
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/radxa-e24c
        cp -v -t /rootfs/artifacts/arm64/u-boot/radxa-e24c u-boot-rockchip.bin
finalize:
  - from: /rootfs
    to: /rootfs