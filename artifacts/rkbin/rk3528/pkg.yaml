name: rkbin-rk3528
variant: scratch
shell: /toolchain/bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/nhz-io/rockchip-rkbin/archive/{{ .rkbin_ref }}.tar.gz
        destination: rkbin.tar.gz
        sha256: "{{ .rkbin_sha256 }}"
        sha512: "{{ .rkbin_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
      PATH: /toolchain/bin:/usr/bin:/bin
    prepare:
      - |
        tar xf rkbin.tar.gz --strip-components=1
    install:
      - |
        mkdir -p /rootfs/rkbin

        cp bin/rk35/rk3528_bl31_v1.20.elf /rootfs/rkbin/bl31.elf
        cp bin/rk35/rk3528_ddr_1056MHz_v1.11.bin /rootfs/rkbin/ddr.bin
finalize:
  - from: /rootfs
    to: /libs