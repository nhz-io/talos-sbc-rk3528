# References:
#   Talos kernel build: https://github.com/siderolabs/pkgs/tree/v1.9.0/kernel
#   Kwiboo RK3528 branch: https://github.com/Kwiboo/linux-rockchip/tree/next-20251219-rk3528
name: kernel-radxa-e24c
variant: scratch
shell: /toolchain/bin/bash
dependencies:
  - stage: base

steps:
  - sources:
      - url: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-{{ .kernel_ref }}.tar.xz
        destination: linux.tar.xz
        sha256: "{{ .kernel_sha256 }}"
        sha512: "{{ .kernel_sha512 }}"
    env:
      ARCH: arm64
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
      PATH: /toolchain/bin:/usr/bin:/bin
      LD_LIBRARY_PATH: /toolchain/lib
    prepare:
      - |
        tar -xJf linux.tar.xz --strip-components=1


        mkdir -p /bin /lib /usr/bin /usr/lib/pkgconfig
        ln -sf /toolchain/bin/bash /bin/bash
        ln -sf /toolchain/bin/bash /bin/sh
        ln -sf /toolchain/lib /lib
        ln -sf /toolchain/bin/env /usr/bin/env
        ln -sf /toolchain/bin/true /bin/true
        ln -sf /toolchain/bin/false /bin/false
        ln -sf /toolchain/bin/pwd /bin/pwd
        ln -sf /toolchain/bin/awk /usr/bin/awk
        ln -sf /toolchain/include /usr/include



        # Start from Talos config-arm64 (same config as stock Talos v1.13.7 kernel)
        # All RK3528 SoC drivers included: ROCKCHIP_PM_DOMAINS, GPIO, SCMI, etc.
        cp /pkg/config/config-arm64 .config
        # Enable options defconfig lacks or Talos config sets as module
        scripts/config --enable USERFAULTFD
        scripts/config --set-val STMMAC_ETH y
        scripts/config --set-val STMMAC_PLATFORM y
        scripts/config --set-val DWMAC_ROCKCHIP y
        scripts/config --enable OVERLAY_FS
        scripts/config --enable EFI
        scripts/config --enable EFI_STUB
        scripts/config --enable EFI_ZBOOT

        # RTL8365MB switch driver — required for RTL8367RB on E24C
        # The switch provides the RGMII RX clock that stmmac needs for DMA reset
        scripts/config --enable NET_DSA_REALTEK
        scripts/config --enable NET_DSA_REALTEK_MDIO
        scripts/config --set-val NET_DSA_REALTEK_RTL8365MB y
        scripts/config --enable NET_DSA_TAG_RTL8_4

        make olddefconfig

        # Re-enable STMMAC/DWMAC after olddefconfig (it may reset =m)
        scripts/config --set-val STMMAC_ETH y
        scripts/config --set-val STMMAC_PLATFORM y
        scripts/config --set-val DWMAC_ROCKCHIP y

        # Re-enable RTL8365MB after olddefconfig (may reset to =m or disabled)
        scripts/config --set-val NET_DSA_REALTEK_RTL8365MB y
        scripts/config --enable NET_DSA_REALTEK_MDIO
        scripts/config --enable NET_DSA_TAG_RTL8_4
      - |
        make -j $(nproc) prepare
    build:
      - |
        make -j $(nproc)
        make -j $(nproc) modules
        make -j $(nproc) dtbs
    install:
      - |
        mkdir -p /rootfs/boot /rootfs/artifacts/arm64/dtb/rockchip /rootfs/certs

        cp arch/arm64/boot/vmlinuz.efi /rootfs/boot/vmlinuz
        cp certs/signing_key.x509 /rootfs/certs/signing_key.x509

        # Copy RK3528 DTBs to artifacts path (matches installer expectations)
        cd ./arch/arm64/boot/dts/rockchip
        for f in rk3528-*.dtb; do
          [ -f "$f" ] && cp "$f" /rootfs/artifacts/arm64/dtb/rockchip/"$f"
        done
        cd -

        # Copy pre-compiled E24C DTB (not in mainline 6.18 — from Kwiboo's 6.19 build)
        cp /pkg/files/rk3528-radxa-e24c.dtb /rootfs/artifacts/arm64/dtb/rockchip/rk3528-radxa-e24c.dtb

        # Install modules
        export KERNELRELEASE=$(cat include/config/kernel.release)
        make -j $(nproc) modules_install DEPMOD=/toolchain/bin/depmod INSTALL_MOD_PATH=/rootfs INSTALL_MOD_STRIP=1
        depmod -b /rootfs $KERNELRELEASE
        unlink /rootfs/lib/modules/$KERNELRELEASE/build 2>/dev/null || true
finalize:
  - from: /rootfs
    to: /rootfs